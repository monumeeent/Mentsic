name: Build Mentsic APK

# Requires the repository secret DEBUG_KEYSTORE_BASE64 (base64 of a stable debug keystore).
# Without it the job fails on purpose: a build signed by a random key cannot install over the
# previous APK, and uninstalling first wipes app data.

on:
  push:
    branches: [ main, master, redesign/mentsic ]
  pull_request:
    branches: [ main, master, redesign/mentsic ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Restore Debug Keystore
      env:
        METROLIST_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/app/debug.keystore
        DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        # The APK must be signed by the SAME key on every run, otherwise Android treats each build
        # as a different app and refuses to update in place — forcing an uninstall first (which
        # also wipes app data such as the listening streak).
        #
        # Required repository secret: DEBUG_KEYSTORE_BASE64
        #   base64 -w0 mentsic-debug.keystore
        #
        # Hard-fail instead of silently generating a throwaway key: a "build succeeded" artifact
        # that cannot be installed over the previous one is worse than a failed build.
        if [ -z "$DEBUG_KEYSTORE_B64" ]; then
          echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set. Add it under Settings → Secrets and variables → Actions, or every APK this workflow produces will require an uninstall before installing."
          exit 1
        fi

        mkdir -p "$(dirname "$METROLIST_DEBUG_KEYSTORE_PATH")"
        echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$METROLIST_DEBUG_KEYSTORE_PATH"

        # Print the certificate fingerprint so two consecutive runs can be compared: if the
        # SHA-256 line changes, the signing identity changed and in-place updates will break.
        echo "Keystore SHA-256 fingerprint (must stay identical between builds):"
        keytool -list -v \
          -keystore "$METROLIST_DEBUG_KEYSTORE_PATH" \
          -storepass android \
          -alias androiddebugkey \
          | grep -E "SHA256:|Alias name:" || true

    - name: Build FOSS Debug APK
      env:
        METROLIST_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/app/debug.keystore
      run: ./gradlew :app:assembleFossDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mentsic-Foss-Debug-APK
        path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
