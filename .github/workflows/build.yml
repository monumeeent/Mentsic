name: Build Mentsic APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manually clicking "Run workflow" in GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build FOSS Debug APK
      run: ./gradlew :app:assembleFossDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mentsic-Foss-Debug-APK
        path: app/build/outputs/apk/foss/debug/app-foss-debug.apk