name: Build Mentsic APK

on:
  push:
    branches: [ main, master, redesign/mentsic ]
  pull_request:
    branches: [ main, master, redesign/mentsic ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Restore Debug Keystore
      env:
        METROLIST_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/app/debug.keystore
        DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        mkdir -p "$(dirname "$METROLIST_DEBUG_KEYSTORE_PATH")"
        if [ -n "$DEBUG_KEYSTORE_B64" ]; then
          # Stable key: keeps the signature identical across builds so an update installs
          # over the previous APK instead of demanding an uninstall first.
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$METROLIST_DEBUG_KEYSTORE_PATH"
        else
          echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set — generating a throwaway keystore. APKs from this run will NOT install over a previous build."
          rm -f "$METROLIST_DEBUG_KEYSTORE_PATH"
          keytool -genkey -v -keystore "$METROLIST_DEBUG_KEYSTORE_PATH" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build FOSS Debug APK
      env:
        METROLIST_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/app/debug.keystore
      run: ./gradlew :app:assembleFossDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mentsic-Foss-Debug-APK
        path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
