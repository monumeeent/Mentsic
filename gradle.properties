# Cap JVM heap at 1000 MB and bump Metaspace to 512 MB to prevent GC thrashing
org.gradle.jvmargs=-Xmx1000m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Keep Kotlin inside the same JVM process to avoid spawning extra processes
kotlin.compiler.execution.strategy=in-process

# Limit workers so CPU threads don't demand extra memory pools
org.gradle.workers.max=1

# Reuse outputs and daemon state
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
kotlin.incremental=true