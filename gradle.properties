# Cap JVM heap at 1000 MB and bump Metaspace to 512 MB to prevent GC thrashing
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Keep Kotlin inside the same JVM process to avoid spawning extra processes
kotlin.compiler.execution.strategy=in-process

# Limit workers so CPU threads don't demand extra memory pools
org.gradle.workers.max=1

# Allow KSP/Hilt to add generated sources via the legacy kotlin.sourceSets DSL
# (required with AGP 9 built-in Kotlin + Hilt/KSP)
android.disallowKotlinSourceSets=false

# Reuse outputs and daemon state
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
kotlin.incremental=true

# Retry transient repository failures instead of failing the build.
#
# Maven Central answers bursts with HTTP 429 (Too Many Requests). Name and format verified against
# Gradle's own behaviour: `max.tentatives` (renamed from `max.retries` before 5.0),
# `initial.backoff` in ms, and note these are read unprefixed — a `systemProp.` prefix makes them
# system properties on the daemon, which Gradle does not read for these keys.
org.gradle.internal.repository.max.tentatives=5
org.gradle.internal.repository.initial.backoff=1500

# Give slow repository responses room instead of timing out mid-download.
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000